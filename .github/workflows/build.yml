# Builds GitWallet on a clean Windows machine and runs its self-test and UI
# walkthrough there. The walkthrough only ever uses the public BIP39 test
# mnemonic, in a throw-away data folder; no secrets are involved.
name: Build and test

on:
  push:
    branches: [main, multi-seed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      GW_VCPKG: C:\vcpkg
      GW_VCPKG_INSTALLED: C:/gw-vcpkg-installed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: 6.10.3
          arch: win64_msvc2022_64
          cache: true

      - name: Restore the built libraries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:/gw-vcpkg-installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*') }}

      - name: Build
        shell: cmd
        run: |
          set "QT_DIR=%QT_ROOT_DIR%"
          call build.bat

      - name: Self-test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts
        run: |
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = "$env:QT_ROOT_DIR\plugins\platforms"
          $p = Start-Process dist\GitWallet.exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow -RedirectStandardOutput selftest.txt
          Get-Content selftest.txt
          exit $p.ExitCode

      - name: UI walkthrough
        shell: pwsh
        timeout-minutes: 30
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts
        run: |
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = "$env:QT_ROOT_DIR\plugins\platforms"
          $out = "$PWD\walkthrough"
          $p = Start-Process dist\GitWallet.exe -ArgumentList '--data-dir', "$env:RUNNER_TEMP\gw", '--walkthrough', $out -Wait -PassThru -NoNewWindow
          $summary = Get-Content "$out\walkthrough.json" -Raw | ConvertFrom-Json
          foreach ($step in $summary.steps) {
            foreach ($check in $step.checks) {
              $mark = if ($check.ok) { 'ok  ' } else { 'FAIL' }
              "$mark $($step.name): $($check.check)"
            }
          }
          "failures: $($summary.failures), exit code: $($p.ExitCode)"
          exit $p.ExitCode

      - name: Keep the walkthrough's screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: walkthrough
          path: walkthrough/
          retention-days: 14
          if-no-files-found: warn
