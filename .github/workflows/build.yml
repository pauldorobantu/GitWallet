# Builds GitWallet on a clean Windows machine and runs its self-test and UI
# walkthrough there. The walkthrough only ever uses the public BIP39 test
# mnemonic, in a throw-away data folder; no secrets are involved.
name: Build and test

on:
  push:
    branches: [main, multi-seed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      GW_VCPKG: C:\vcpkg
      GW_VCPKG_INSTALLED: C:/gw-vcpkg-installed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: 6.10.3
          arch: win64_msvc2022_64
          cache: true

      - name: Restore the built libraries
        id: libraries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:/gw-vcpkg-installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*') }}

      - name: Build
        shell: cmd
        run: |
          set "QT_DIR=%QT_ROOT_DIR%"
          call build.bat

      # Right after the build, not at the end of the job: a failed test, or a compile error
      # in the app after the libraries were done, must not cost the next run an hour of
      # compiling them again.
      - name: Are the libraries whole
        id: whole
        if: always() && steps.libraries.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $include = 'C:/gw-vcpkg-installed/x64-windows-release-only/include'
          $whole = (Test-Path "$include/sqlcipher/sqlite3.h") -and (Test-Path "$include/botan/version.h") -and (Test-Path "$include/secp256k1.h") -and (Test-Path "$include/zlib.h")
          "whole=$($whole.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Save the built libraries
        if: always() && steps.whole.outputs.whole == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:/gw-vcpkg-installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*') }}

      # All of these start the deployed folder as a user's PC would: see
      # .github/start-gitwallet.ps1. Offscreen runs with the Qt install on hand
      # cannot tell whether the app really starts.
      - name: Start like a user
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force walkthrough | Out-Null
          $shot = "$PWD\walkthrough\00-started-like-a-user.png"
          ./.github/start-gitwallet.ps1 -Arguments '--data-dir', "$env:RUNNER_TEMP\gw-start", '--screenshot', $shot
          $code = $LASTEXITCODE
          "exit code: $code"
          if ($code -ne 0) { exit 1 }
          if (-not (Test-Path $shot)) { 'the window never rendered'; exit 1 }
          "window rendered: $((Get-Item $shot).Length) bytes"

      - name: Self-test
        shell: pwsh
        run: |
          ./.github/start-gitwallet.ps1 -Arguments '--selftest' -StdOut selftest.txt
          $code = $LASTEXITCODE
          Get-Content selftest.txt
          exit $code

      - name: Store test
        shell: pwsh
        run: |
          ./.github/start-gitwallet.ps1 -Arguments '--data-dir', "$env:RUNNER_TEMP\gw-store", '--store-test' -StdOut storetest.txt
          $code = $LASTEXITCODE
          Get-Content storetest.txt
          exit $code

      # The most the plan counts on, in the real window: what would freeze it fails here.
      - name: Window at scale
        shell: pwsh
        timeout-minutes: 15
        run: |
          ./.github/start-gitwallet.ps1 -Arguments '--data-dir', "$env:RUNNER_TEMP\gw-scale", '--scale-test', '425000' -StdOut scale.txt
          $code = $LASTEXITCODE
          Get-Content scale.txt
          exit $code

      - name: UI walkthrough
        shell: pwsh
        timeout-minutes: 30
        run: |
          $out = "$PWD\walkthrough"
          ./.github/start-gitwallet.ps1 -Arguments '--data-dir', "$env:RUNNER_TEMP\gw", '--walkthrough', $out
          $code = $LASTEXITCODE
          $summary = Get-Content "$out\walkthrough.json" -Raw | ConvertFrom-Json
          foreach ($step in $summary.steps) {
            foreach ($check in $step.checks) {
              $mark = if ($check.ok) { 'ok  ' } else { 'FAIL' }
              "$mark $($step.name): $($check.check)"
            }
          }
          "failures: $($summary.failures), exit code: $code"
          exit $code

      # Against the live public servers: a scan read in rounds must read the same as one
      # followed live, and one more network must take a line in a file and no code.
      - name: Compare scans
        shell: pwsh
        timeout-minutes: 45
        run: ./.github/compare-scans.ps1 -Report scans

      # Decoders that have nothing to do with the app: every size it can draw, and what the walkthrough
      # found on the Receive page. After the rest, so that a decoder's new release hides nothing.
      - name: Other readers read the QR codes
        if: always()
        shell: pwsh
        run: |
          ./.github/start-gitwallet.ps1 -Arguments '--qr-samples', "$env:RUNNER_TEMP\qr"
          if ($LASTEXITCODE -ne 0) { 'the codes were not written'; exit 1 }
          python -m pip install --quiet "zxing-cpp==2.3.0" "opencv-python-headless==4.14.0.94"
          if ($LASTEXITCODE -ne 0) { 'the decoders did not install'; exit 1 }
          python .github/check-qr.py "$env:RUNNER_TEMP\qr" 166 8
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Test-Path walkthrough/qr-on-screen/samples.json) {
            python .github/check-qr.py walkthrough/qr-on-screen 1
            exit $LASTEXITCODE
          }

      - name: Keep the walkthrough's screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: walkthrough
          path: walkthrough/
          retention-days: 14
          if-no-files-found: warn
